<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FMA Viewer · 이미지 메타정보 편집</title>
    <style>
        :root{color-scheme:dark;font-family:Pretendard,"Segoe UI",sans-serif;background:#0b0f15;color:#edf5ff}
        *{box-sizing:border-box}body{margin:0;min-width:620px;background:#0b0f15}header,footer{position:sticky;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#171d28;border-bottom:1px solid #303b4d}header{top:0}footer{bottom:0;border-top:1px solid #303b4d;border-bottom:0}h1{font-size:20px;margin:0}small{color:#a8b6c9}.content{padding:18px 20px 28px}.technical{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 24px}.technical div{padding:10px;border-radius:9px;background:#202938}.technical span{display:block;color:#9eb0c6;font-size:12px}.technical b{display:block;margin-top:4px;color:#8eeeff;font-size:13px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{display:grid;gap:6px;color:#c8d4e3;font-size:13px}.wide{grid-column:1/-1}input,textarea{width:100%;padding:11px 12px;color:#f5f8fc;background:#222b3b;border:1px solid #3b485c;border-radius:9px;font:inherit}textarea{resize:vertical}.section-title{display:flex;align-items:center;justify-content:space-between;margin-top:24px}.custom-row{display:grid;grid-template-columns:1fr 1.5fr 38px;gap:8px;margin:8px 0}button{padding:9px 14px;color:#f4f8ff;background:#293346;border:1px solid #43516a;border-radius:9px;font-weight:700;cursor:pointer}.primary{color:#07131c;background:linear-gradient(135deg,#78e6ff,#9cff89);border:0}.danger{color:#ff9eaa;background:#351c25}.embedded{margin-top:20px;padding:12px;border:1px solid #334056;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b9c9db}.status{color:#79efcf;font-weight:700}@media(max-width:720px){body{min-width:0}.technical,.form{grid-template-columns:1fr}.wide{grid-column:auto}}
    </style>
</head>
<body>
<header><div><h1>이미지 메타정보 편집</h1><small>이 창을 옮겨 놓고 FMA Viewer를 계속 사용할 수 있습니다.</small></div><button id="closeBtn">×</button></header>
<main class="content">
    <section><h3>기본 정보</h3><div id="technical" class="technical"></div></section>
    <section class="form">
        <label><span>파일명·경로</span><input id="path"></label><label><span>그룹</span><input id="group"></label>
        <label><span>생성일</span><input id="createdAt" type="datetime-local"></label><label><span>제목</span><input id="title"></label>
        <label><span>작성자</span><input id="author"></label><label><span>저작권</span><input id="copyright"></label>
        <label class="wide"><span>키워드(쉼표로 구분)</span><input id="keywords"></label>
        <label class="wide"><span>설명</span><textarea id="description" rows="4"></textarea></label>
    </section>
    <div class="section-title"><h3>사용자 정의 메타정보</h3><button id="addField">＋ 필드 추가</button></div>
    <div id="custom"></div>
    <details class="embedded"><summary>원본 EXIF · XMP · IPTC 전체 보기</summary><pre id="embedded">메타정보를 읽는 중…</pre></details>
</main>
<footer><span id="status" class="status">FMA Viewer 연결 대기 중…</span><div><button id="cancelBtn">취소</button> <button id="saveBtn" class="primary">메타정보 저장</button></div></footer>
<script src="js/image/metadataWindow.js?v=20260802-1"></script>
</body>
</html>
