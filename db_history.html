<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FMA Viewer · DB 히스토리</title>
    <link rel="stylesheet" href="css/dbHistory.css?v=20260731-3">
</head>

<body>
    <header class="db-history-header">
        <div>
            <h1>SaveDB 히스토리</h1>
            <p>브라우저 IndexedDB에 저장된 FMA Viewer 상태를 관리합니다.</p>
        </div>
        <div class="db-history-header-actions">
            <button id="btnRefreshHistory" type="button">↻ 새로고침</button>
            <button id="btnDeleteAllHistory" class="danger" type="button">전체 삭제</button>
        </div>
    </header>

    <main>
        <div class="db-history-summary">
            <strong id="historyCount">0개 저장</strong>
            <span id="historySize">0 B</span>
        </div>
        <div id="historyStatus" class="db-history-status" aria-live="polite">DB 히스토리를 불러오는 중…</div>
        <section id="historyList" class="db-history-list"></section>
    </main>

    <template id="historyItemTemplate">
        <article class="db-history-item">
            <div class="db-history-thumb"><span>FMA</span></div>
            <div class="db-history-details">
                <h2></h2>
                <p class="saved-at"></p>
                <div class="db-history-badges"></div>
            </div>
            <div class="db-history-actions">
                <button class="restore-history primary" type="button">FMA Viewer로 불러오기</button>
                <button class="delete-history danger" type="button">삭제</button>
            </div>
        </article>
    </template>

    <div id="historyRestoreOverlay" class="db-restore-overlay" role="dialog" aria-modal="true"
        aria-labelledby="historyRestoreTitle" style="display:none;">
        <div class="db-restore-card">
            <div class="db-restore-icon">DB</div>
            <h2 id="historyRestoreTitle">저장된 FMA를 불러오는 중입니다</h2>
            <p id="historyRestoreMessage">대용량 이미지 데이터를 준비하고 있습니다.</p>
            <div class="db-restore-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
                aria-valuenow="0">
                <span id="historyRestoreBar"></span>
            </div>
            <strong id="historyRestorePercent">0%</strong>
            <small id="historyRestoreDetail"></small>
        </div>
    </div>

    <script src="js/storage/dbHistory.js?v=20260804-1"></script>
</body>

</html>
