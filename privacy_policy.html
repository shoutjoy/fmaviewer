# FMA Viewer 개인정보 처리방침

시행일: 2026년 8월 1일

FMA Viewer(이하 “앱”)는 브라우저에서 이미지와 영상을 관리·편집하는 도구입니다. 개발자 박중희는 앱의 최초 사용자 확인과 문의 대응을 위해 아래와 같이 최소한의 개인정보를 처리합니다.

## 1. 처리하는 개인정보

앱을 처음 사용할 때 다음 정보를 입력하거나 생성합니다.

- 사용자가 입력한 Gmail 주소
- 최초 사용 일자와 시각(시·분)
- FMA Viewer 사용 알림이라는 이용 정보

앱은 비밀번호, Gmail 인증 토큰 또는 Google 계정 비밀번호를 요구하거나 저장하지 않습니다.

## 2. 처리 목적

- FMA Viewer 최초 사용자 확인
- 사용 현황 확인과 운영상 공지
- 문의, 오류 신고 및 지원 대응

입력한 Gmail 주소가 앱 사용을 별도로 승인하거나 사용자의 신원을 보증하는 것은 아닙니다.

## 3. 저장 및 전달 방식

- 동의 여부, 입력한 Gmail 주소와 최초 사용 시각은 현재 브라우저의 로컬 저장소에 보관됩니다.
- 시작 버튼을 누르면 입력한 Gmail 계정을 선택하도록 요청하면서 받는 사람이 `shoutjoy1@yonsei.ac.kr`로 지정된 Gmail 메일 작성 화면이 열립니다.
- Gmail 작성 화면에는 입력한 주소와 최초 사용 시각을 이용해 만든 사용 알림 문구가 미리 입력됩니다.
- 앱은 메일을 자동으로 전송하지 않으며 실제 전송 여부를 확인하지 않습니다. 사용자가 내용을 확인하고 Gmail에서 직접 전송해야 합니다.
- Gmail을 열고 메일을 전송하는 과정에는 Google의 개인정보 처리방침과 보유 정책이 적용됩니다.
- 브라우저 데이터 또는 사이트 데이터를 삭제하면 앱에 저장된 최초 사용자 기록도 삭제될 수 있습니다.

앱은 사용자의 Gmail 계정으로 로그인하거나 사용자 계정에서 메일을 자동 발송하지 않습니다. 입력한 Gmail 주소는 Gmail에서 사용할 계정을 선택하는 데 이용되며, 로그인되어 있지 않으면 Google 로그인 화면이 표시될 수 있습니다.

## 4. 이미지·영상 및 AI 기능

- 일반 보기, Crop, Canvas 편집, 로컬 배경 제거 등은 가능한 범위에서 현재 브라우저 안에서 처리됩니다.
- 사용자가 Google AI Studio 기반 AI 기능을 실행하면 선택한 이미지, 참고 이미지, 프롬프트 등이 Google Gemini API로 전송될 수 있습니다.
- 외부 내장 앱이나 링크를 열면 해당 서비스의 개인정보 처리방침과 이용약관이 적용됩니다.
- FMA 프로젝트, SaveDB 및 편집 결과는 사용자가 직접 저장하거나 삭제할 수 있습니다.

## 5. 보유 기간과 삭제

- 브라우저 로컬 기록: 사용자가 브라우저 사이트 데이터 또는 로컬 저장소를 삭제할 때까지
- 사용자가 Gmail에서 직접 발송한 사용 알림: 사용자 확인 및 지원 목적이 끝날 때까지 또는 삭제 요청 처리 시까지

사용자는 개발자에게 이메일로 본인의 최초 사용자 알림 삭제를 요청할 수 있습니다.

## 6. 이용자의 권리

사용자는 개인정보의 열람, 정정, 삭제 및 처리 중지를 요청할 수 있습니다. 요청 시 본인 확인에 필요한 최소 정보가 요구될 수 있습니다.
